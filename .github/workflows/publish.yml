# Publish SnakeTail: on tag, build and create a GitHub Release, uploading only the portable x64 build and the source zip
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.9.8); passed in automatically by Version Release'
        required: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore SnakeTail.sln
        shell: pwsh

      - name: Build SnakeTail (portable x64)
        run: msbuild src\SnakeTail.csproj '/p:Configuration=Release;PlatformTarget=x64' '/t:Clean;Rebuild'
        shell: pwsh

      - name: Locate x64 build output directory
        id: outdir
        run: |
          $candidates = @(
            '.temp\bin\Release\net8.0-windows',
            '.temp\bin\x64\Release\net8.0-windows'
          )
          $outDir = $null
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d 'SnakeTail.exe')) {
              $outDir = $d
              break
            }
          }
          if (-not $outDir) {
            Write-Host "SnakeTail.exe not found; checked: $($candidates -join ', ')"
            Get-ChildItem -Path .temp\bin -Recurse -Filter 'SnakeTail.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          "OUTDIR=$outDir" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "path=$outDir" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Package release artifacts and source
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF -match 'refs/tags/(.+)') { $Matches[1] } else { $null }
          $version = if ($tag -match '^v(.+)$') { $Matches[1] } else { (Get-Date -Format 'yyyy.MM.dd.HHmm') }
          if (-not $env:OUTDIR -or -not (Test-Path (Join-Path $env:OUTDIR 'SnakeTail.exe'))) {
            Write-Error "OUTDIR is not set or invalid (SnakeTail.exe missing); check the previous step 'Locate x64 build output directory'"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item $env:OUTDIR\* publish\ -Recurse -Force
          Compress-Archive -Path publish\* -DestinationPath "SnakeTail-$version-portable-x64.zip" -Force
          git archive -o "SnakeTail-$version-src.zip" HEAD
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnakeTail-build
          path: |
            SnakeTail-*-portable-x64.zip
            SnakeTail-*-src.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            SnakeTail-*-portable-x64.zip
            SnakeTail-*-src.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
