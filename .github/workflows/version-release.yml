# When the version in SnakeTail.csproj changes, automatically create a tag and trigger the Publish workflow
name: Version Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/SnakeTail.csproj'

permissions:
  contents: write
  actions: write    # Needed to trigger workflow_dispatch

jobs:
  tag-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' src/SnakeTail.csproj || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/SnakeTail.csproj)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
        shell: bash

      - name: Check whether tag already exists
        id: check-tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${TAG} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Will create tag ${TAG} and trigger release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Trigger Publish workflow
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          gh workflow run publish.yml -f tag="v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
